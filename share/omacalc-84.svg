      <rect x="51" y="90" width="12" height="8" rx="2.5"/>
      <rect x="67" y="90" width="12" height="8" rx="2.5"/>
      <rect x="81" y="90" width="12" height="8" rx="2.5"/>
      <rect x="35" y="102" width="12" height="8" rx="2.5"/>
